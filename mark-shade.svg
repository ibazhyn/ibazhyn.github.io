<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" fill="none">
<desc>The shading of the owner's identity mark, as an alpha map. From
  personal-brand/logo-17.09/logo-17.09-dark-shading.svg, drawing unedited.

  The owner exported the shading twice, dark and light, and the two files are
  the same three gradients at the same opacities: only the stop colour differs.
  So it is one file here and it is used as a mask, never as a picture.
  app/globals.css stacks it on the flat contour of public/mark.svg and paints
  it black over a light fill (lemon, white) or white over a dark one (ink). The
  colour is a background, so it interpolates, and a hover never swaps a file.</desc>
